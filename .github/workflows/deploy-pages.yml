name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 项目页挂在 /<仓库名>/ 下，所以构建时要带上同样的 base
      - name: Build for the repository subpath
        run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      # GitHub Pages 对未知路径返回 404.html，不会回落到 index.html；
      # 把 index.html 复制成 404.html 就是单页应用的标准做法（刷新 /review 不再 404）。
      # 同时放一个 .nojekyll，避免 Pages 用 Jekyll 处理构建产物。
      - name: Single-page fallback and Jekyll opt-out
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
