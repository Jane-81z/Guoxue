# 国学背诵 · Nginx 站点配置（国内轻量服务器 + 自有域名）
# 用法：把本文件放到 /etc/nginx/conf.d/guoxue.conf，把域名换成你自己的，然后
#   sudo nginx -t && sudo systemctl reload nginx
# 证书用 certbot 自动申请（见 deploy/上线清单.md 第 6 步），它会自己改写下面的 443 段。

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← 换成你的域名

    root /var/www/guoxue;
    index index.html;

    # 站点是单页应用：/review、/library、/player、/settings、/import 都必须回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 哈希命名的构建产物可以永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker 绝不能长缓存，否则更新发不出去
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 图标与字体按中等时长缓存
    location ~* \.(png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # 找不到的静态文件不要吐默认页
    error_page 404 /index.html;
}
